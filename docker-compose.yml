# GateWayr — Docker Compose
#
# Spins up the full distributed system locally:
#   - 1 API Gateway (reverse proxy + load balancer) on port 8080
#   - 3 Backend CRUD API instances on internal port 9000
#
# Usage:
#   docker compose up --build
#   curl http://localhost:8080/health        # Observe round-robin cycling
#
# NOTE: Each backend has its own in-memory store, so data is NOT shared
# across instances. This is intentional for Phase 1 — Firestore will
# provide shared persistence in Phase 2.

services:
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped
    environment:
      CONFIG_PATH: "/app/config.yaml"

  backend-1:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PORT: "9000"
      INSTANCE_NAME: "backend-1"
    restart: unless-stopped

  backend-2:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PORT: "9000"
      INSTANCE_NAME: "backend-2"
    restart: unless-stopped

  backend-3:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PORT: "9000"
      INSTANCE_NAME: "backend-3"
    restart: unless-stopped
